# Serves the Expo web static export (web.output: "static").
#
# `expo export --platform web` writes each route to a flat "<route>.html"
# (insights.html, settings.html, ...) with extensionless URLs (/insights).
# Stock nginx would 404 a hard load of /insights because no file is literally
# named "insights". The try_files below maps the URL to its .html file, and
# falls back to the SPA shell so deep links and dynamic routes (/log/:type,
# /metric/:kind, whose exported files are bracket-named) still boot and let
# the client router take over.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Content-hashed bundles and assets: cache hard, and 404 (never fall back
    # to HTML) when a stale client asks for a chunk that no longer exists.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
